<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemutar Media Kuliah Responsif</title>
    <link rel="stylesheet" href="03-tugas-style.css">
</head>

<body>

    <header class="page-header">
        <h1 class="page-header__title">Pemutar Media Kuliah Responsif</h1>
        <p class="page-header__subtitle">Platform E-Learning Kampus &mdash; Galeri Materi Video</p>
    </header>

    <main class="media-gallery">
        <!-- Kartu 1: menggunakan modifier -->
        <article class="lecture-card lecture-card--featured">
            <!-- Elemen picture untuk art direction sampul kartu -->
            <picture class="lecture-card__cover">
                <!-- Layar lebar (>= 800px): sampul landscape format WebP -->
                <source media="(min-width: 800px)" srcset="assets/images/sampul-cascading-large.webp" type="image/webp">
                <!-- Layar sempit (< 800px): sampul potret/crop format WebP -->
                <source media="(max-width: 799px)" srcset="assets/images/sampul-cascading-small.webp" type="image/webp">
                <!-- Cadangan bila peramban tidak mendukung WebP maupun elemen picture -->
                <img src="assets/images/sampul-cascading-fallback.jpg"
                    alt="Ilustrasi konsep cascading dan spesifisitas CSS" class="lecture-card__cover-img"
                    loading="lazy">
            </picture>
    </main>

</body>

</html>
